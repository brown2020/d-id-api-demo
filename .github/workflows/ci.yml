name: ci
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    # Client NEXT_PUBLIC_* is optional for this gate: firebaseClient skips init
    # when unset so SSG succeeds. Never inline keys here — if a future smoke
    # job needs Firebase web config, inject only via ${{ secrets.* }} on that
    # job (not this lint/typecheck/test/build gate).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
