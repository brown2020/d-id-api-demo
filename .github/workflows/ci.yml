name: ci
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_APIKEY: REDACTED_BY_HISTORY_PURGE
      NEXT_PUBLIC_FIREBASE_AUTHDOMAIN: didaiapp.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECTID: didaiapp
      NEXT_PUBLIC_FIREBASE_STORAGEBUCKET: didaiapp.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID: "657651711995"
      NEXT_PUBLIC_FIREBASE_APPID: REDACTED_BY_HISTORY_PURGE
      NEXT_PUBLIC_FIREBASE_MEASUREMENTID: REDACTED_BY_HISTORY_PURGE
      NEXT_PUBLIC_STRIPE_PRODUCT_NAME: D-ID Demo Credits
      # Publishable key optional for CI; payment page degrades without it
      NEXT_PUBLIC_STRIPE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
